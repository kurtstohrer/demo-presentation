<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/skill/scenes/scene.css">
<style>
  .log { flex: 1; min-height: 0; overflow: hidden; padding: 34px 0 10px; }
  .col { width: min(1340px, calc(100% - 96px)); margin: 0 auto; display: flex; flex-direction: column; gap: 26px; }
  .msg { display: flex; gap: 18px; font-size: var(--fs); line-height: 1.45; animation: fade-in 350ms ease-out both; }
  .msg.user { justify-content: flex-end; }
  .msg.user .body { max-width: 72%; padding: 16px 24px; border-radius: 22px 22px 6px 22px; background: var(--accent); color: #fff; white-space: pre-wrap; }
  .avatar { width: 46px; height: 46px; flex: none; border-radius: 50%; display: grid; place-items: center;
    background: var(--panel); border: 1px solid var(--line); color: var(--fg); font: 700 20px/1 Inter, sans-serif; }
  .agent .body { flex: 1; min-width: 0; }
  .name { color: var(--muted); font-size: 0.68em; font-weight: 600; margin: 8px 0 6px; }
  .agent p { margin: 0 0 0.55em; }
  .agent p:last-child, .agent ul:last-child { margin-bottom: 0; }
  .agent ul { margin: 0 0 0.55em; padding-left: 1.2em; }
  .agent li { margin: 0.15em 0; }
  code { font-family: 'JetBrains Mono', monospace; font-size: 0.86em; padding: 0.08em 0.36em; border-radius: 6px;
    background: var(--panel); border: 1px solid var(--line); }
  .user code { background: rgb(255 255 255 / 0.16); border-color: transparent; color: inherit; }
  .tool { display: flex; align-items: center; gap: 14px; margin: 4px 0 4px 64px; padding: 12px 18px; border-radius: 12px;
    background: var(--panel); border: 1px solid var(--line); font-size: calc(var(--fs) * 0.78); animation: fade-in 300ms ease-out both; }
  .tool .cmd { font-family: 'JetBrains Mono', monospace; color: var(--fg); }
  .tool .result { color: var(--muted); margin-left: auto; padding-left: 24px; white-space: nowrap; }
  .tool .state { width: 22px; height: 22px; flex: none; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent);
    animation: spin 800ms linear infinite; }
  .tool.done .state { border: 0; animation: none; background: var(--good); position: relative; }
  .tool.done .state::after { content: ''; position: absolute; left: 7px; top: 3px; width: 5px; height: 11px;
    border: solid var(--bg-2); border-width: 0 3px 3px 0; transform: rotate(45deg); }
  .tool.failed .state { border: 0; animation: none; background: var(--bad); }
  .tool.failed .result { color: var(--bad); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dots3 { display: inline-flex; gap: 8px; padding: 14px 0; }
  .dots3 i { width: 11px; height: 11px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite both; }
  .dots3 i:nth-child(2) { animation-delay: 0.2s; }
  .dots3 i:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  .composer { flex: none; padding: 18px 0 28px; border-top: 1px solid var(--line); }
  .box { width: min(1340px, calc(100% - 96px)); margin: 0 auto; display: flex; align-items: center; gap: 16px;
    padding: 16px 16px 16px 26px; border: 1px solid var(--line); border-radius: 18px; background: var(--bg); font-size: var(--fs); }
  .box.focus { border-color: var(--accent); }
  .input { flex: 1; min-height: 1.45em; line-height: 1.45; white-space: pre-wrap; }
  .input:empty::before { content: attr(data-placeholder); color: var(--muted); }
  .input.typing::after { content: ''; display: inline-block; width: 2px; height: 1.1em; margin-left: 1px; vertical-align: -0.15em; background: var(--accent); }
  .send { width: 48px; height: 48px; flex: none; border-radius: 12px; background: var(--line); display: grid; place-items: center; transition: background 150ms; }
  .send.ready { background: var(--accent); }
  .send::before { content: ''; width: 0; height: 0; border-left: 16px solid var(--bg-2); border-top: 10px solid transparent; border-bottom: 10px solid transparent; margin-left: 4px; }
</style>
</head>
<body>
<div class="stage">
  <div class="scene-title"></div>
  <div class="scene-sub"></div>
  <div class="window">
    <div class="window-bar"><span class="dots"><i></i><i></i><i></i></span><span id="wtitle">chat</span></div>
    <div class="log" id="log"><div class="col" id="col"></div></div>
    <div class="composer"><div class="box" id="box"><div class="input" id="input"></div><div class="send" id="send"></div></div></div>
  </div>
</div>
<script src="/skill/scenes/runtime.js"></script>
<script>
(() => {
  const S = window.__scene
  const log = document.getElementById('log')
  const col = document.getElementById('col')
  const box = document.getElementById('box')
  const input = document.getElementById('input')
  const send = document.getElementById('send')
  let agentName = 'Agent'
  let typeMs = 34
  let streamMs = 45

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
  // Inline markdown: `code` and **bold**.
  const inline = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
  // Blocks: paragraphs split by blank lines, and "- " lines as a list.
  function blocks(text) {
    return String(text).split(/\n\s*\n/).map((para) => {
      const lines = para.split('\n')
      if (lines.every((l) => /^\s*[-*] /.test(l))) return `<ul>${lines.map((l) => `<li>${inline(l.replace(/^\s*[-*] /, ''))}</li>`).join('')}</ul>`
      return `<p>${lines.map(inline).join('<br>')}</p>`
    }).join('')
  }

  // Keep the newest message in view.
  const follow = () => log.scrollTo({ top: log.scrollHeight, behavior: 'smooth' })

  function add(html, cls) {
    const el = document.createElement('div')
    el.className = cls
    el.innerHTML = html
    col.appendChild(el)
    follow()
    return el
  }

  const agentRow = (inner) => add(`<div class="avatar">${esc(agentName.slice(0, 1).toUpperCase())}</div>
    <div class="body"><div class="name">${esc(agentName)}</div><div class="text">${inner}</div></div>`, 'msg agent')

  S.on('init', (scene) => {
    document.documentElement.style.setProperty('--fs', `${scene.fontSize || 28}px`)
    document.getElementById('wtitle').textContent = scene.windowTitle || 'chat'
    if (scene.title) document.querySelector('.scene-title').textContent = scene.title
    if (scene.subtitle) document.querySelector('.scene-sub').textContent = scene.subtitle
    agentName = scene.agentName || 'Agent'
    typeMs = scene.typeMs ?? 34
    streamMs = scene.streamMs ?? 45
    input.dataset.placeholder = scene.placeholder ?? `Message ${agentName.toLowerCase() === 'agent' ? 'the agent' : agentName}…`
  })

  // user: type into the message box, then send it as a bubble.
  S.on('user', async (text) => {
    box.classList.add('focus')
    input.classList.add('typing')
    for (const ch of String(text)) {
      input.textContent += ch
      send.classList.add('ready')
      await S.sleep(typeMs + Math.random() * typeMs * 0.8)
    }
    await S.sleep(380)
    input.textContent = ''
    input.classList.remove('typing')
    box.classList.remove('focus')
    send.classList.remove('ready')
    add(`<div class="body">${inline(text)}</div>`, 'msg user')
    await S.sleep(350)
  })

  // agent: the reply streams in word by word; a string, or { text, ms } to set the per-word time.
  S.on('agent', async (value) => {
    const text = typeof value === 'string' ? value : value.text
    const ms = (typeof value === 'object' && value.ms) || streamMs
    const row = agentRow('')
    const target = row.querySelector('.text')
    const words = String(text).split(/(\s+)/)
    let shown = ''
    for (let i = 0; i < words.length; i += 2) {
      shown += words[i] + (words[i + 1] || '')
      target.innerHTML = blocks(shown)
      if (i % 8 === 0) follow()
      await S.sleep(ms)
    }
    target.innerHTML = blocks(text)
    follow()
  })

  // thinking: a typing indicator for that many ms.
  S.on('thinking', async (ms) => {
    const row = agentRow('<span class="dots3"><i></i><i></i><i></i></span>')
    await S.sleep(Number(ms) || 1200)
    row.remove()
  })

  // tool: a row for a command the agent runs: { name, result, ms, failed }.
  S.on('tool', async (t) => {
    const tool = typeof t === 'string' ? { name: t } : t
    const row = add(`<span class="state"></span><span class="cmd">${esc(tool.name)}</span><span class="result"></span>`, 'tool')
    await S.sleep(tool.ms ?? 1100)
    row.classList.add(tool.failed ? 'failed' : 'done')
    if (tool.result) row.querySelector('.result').textContent = tool.result
    await S.sleep(250)
  })

  S.on('clear', async () => {
    col.innerHTML = ''
    await S.sleep(200)
  })
})()
</script>
</body>
</html>
