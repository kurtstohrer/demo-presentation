name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      - name: Tag matches the plugin, skill and changelog versions
        run: uv run --no-project --python 3.12 python scripts/check.py --tag "$GITHUB_REF_NAME"

      # A plain archive of the skill folder, for installs that don't go through a plugin
      # marketplace or a skills installer: unzip into your agent's skills directory.
      - name: Package the skill
        run: |
          mkdir -p dist
          (cd skills && zip -qr "../dist/demo-presentation-$GITHUB_REF_NAME.zip" demo-presentation -x '*/__pycache__/*')
          (cd dist && sha256sum *.zip > SHA256SUMS)

      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[?"v {on=1; next} on && /^## / {exit} on' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --title "$GITHUB_REF_NAME" --notes-file dist/notes.md --verify-tag
