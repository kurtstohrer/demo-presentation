# demo-presentation settings for this repo's own README videos.
# No logo: the videos stay unbranded.
base_url = "http://127.0.0.1:4310"
theme = "dark"
voice = "af_heart"

# The sample app the videos walk through (docs/videos/sample-app). `demo up` starts it.
[[services]]
name = "sample-app"
start = "uv run --no-project python -m http.server 4310 --bind 127.0.0.1 --directory docs/videos/sample-app"
stop = "pkill -f 'http.server 4310'"
ready = "curl -fs http://127.0.0.1:4310/ >/dev/null"

[lexicon]
CLI = "C L I"
TTS = "T T S"
JSON = "jason"
TOML = "tommel"
MP4 = "M P 4"
uv = "you vee"
npx = "N P X"
ffmpeg = "eff eff em peg"
Kokoro = "/kˈOkəɹO/"
Playwright = "play wright"
"SKILL.md" = "skill dot M D"
"script.json" = "script dot jason"
"config.toml" = "config dot tommel"
"brief.md" = "brief dot M D"
UI = "U I"
SOP = "S O P"
PR = "P R"
gitignore = "git ignore"
GL = "G L"

